x-mongo: &mongo
  MONGO_URI: ${MONGO_URI}

services:
  gateway:
    build: ./API-Gateway_Microservice
    ports: ["5000:5000"]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REG_URL: http://registration:5001
      LOGIN_URL: http://login:5002
      ROOM_URL: http://room:5003
      BOOKING_URL: http://nginx:80
      PAYMENT_URL: http://payment:5005
      NOTIF_URL: http://notification:5006
    depends_on: [registration, login, room, nginx, payment, notification]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  registration:
    build: ./Registration_Microservice
    environment:
      <<: *mongo
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  login:
    build: ./Authentication_Microservice
    environment:
      <<: *mongo
      JWT_SECRET: ${JWT_SECRET}
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  room:
    build: ./Room_Microservice
    environment:
      <<: *mongo
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5003/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  booking-service-1: 
    build: ./Booking_Microservice
    environment:
      <<: *mongo
      ROOM_URL: http://room:5003
      PAYMENT_URL: http://payment:5005
      NOTIF_URL: http://notification:5006
      INSTANCE_NAME: booking-1
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  booking-service-2:
    build: ./Booking_Microservice
    environment:
      <<: *mongo
      ROOM_URL: http://room:5003
      PAYMENT_URL: http://payment:5005
      NOTIF_URL: http://notification:5006
      INSTANCE_NAME: booking-2
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5004/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  payment:
    build: ./Payment_Microservice
    environment:
      <<: *mongo
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5005/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  notification:
    build: ./Notifications_Microservice
    environment:
      <<: *mongo
    restart: on-failure

  nginx:
    build: ./nginx
    depends_on: [booking-service-1, booking-service-2]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5006/health"]
      interval: 15s
      timeout: 3s
      retries: 3
